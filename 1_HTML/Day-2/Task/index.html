<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML - Day 1</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
}

.container{
    width:80%;
    max-width:900px;
    margin:50px auto;
}

h1{
    text-align:center;
    margin-bottom:10px;
    color:#222;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:35px;
}

.tasks{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.task{
    background:white;
    text-decoration:none;
    color:#222;
    padding:20px;
    border-radius:10px;
    border:1px solid #ddd;
    transition:0.3s;
}

.task:hover{
    background:#2563eb;
    color:white;
    transform:translateY(-5px);
}

.task h3{
    margin-bottom:10px;
}

.back{
    display:inline-block;
    margin-top:35px;
    text-decoration:none;
    color:white;
    background:#2563eb;
    padding:10px 20px;
    border-radius:6px;
}

.back:hover{
    background:#1d4ed8;
}

</style>

</head>
<body>
<div class="container">

    <h1>HTML - Day 2</h1>

    <p>Tasks completed during Day 2.</p>

    <div class="tasks">

        <a href="blockelement.html" class="task">
            <h3>Task 1</h3>
            <p>Block Level Elements</p>
        </a>

        <a href="inline.html" class="task">
            <h3>Task 2</h3>
            <p>Inline Elements</p>
        </a>

        <a href="formatting.html" class="task">

            <p>Formatting Tags</p>
        </a>

        <a href="interactive.html" class="task">
            <h3>Task 4</h3>
            <p>Interactive Tags</p>
        </a>

        <a href="page.html" class="task">
            <h3>Task 5</h3>
            <p>HTML page</p>
        </a>

    </div>

    <a href="../../../index.html" class="back">← Back to Home</a>

</div>
