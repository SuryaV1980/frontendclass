<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Cards</title>
    <link rel="stylesheet" href="Assert/css/product.css">
</head>
<body>

    <h1>Our Products</h1>

    <div class="products">

        <div class="product-card">
            <img src="images/product1.jpg" alt="Headphones">
            <h2>Wireless Headphones</h2>
            <p class="price">$49</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="images/product2.jpg" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p class="price">$79</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="images/product3.jpg" alt="Keyboard">
            <h2>Mechanical Keyboard</h2>
            <p class="price">$59</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="images/product4.jpg" alt="Mouse">
            <h2>Wireless Mouse</h2>
            <p class="price">$29</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="images/product5.jpg" alt="Speaker">
            <h2>Bluetooth Speaker</h2>
            <p class="price">$45</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="images/product6.jpg" alt="Camera">
            <h2>Digital Camera</h2>
            <p class="price">$299</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="images/product7.jpg" alt="Laptop">
            <h2>Laptop</h2>
            <p class="price">$699</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="images/product8.jpg" alt="Tablet">
            <h2>Tablet</h2>
            <p class="price">$399</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
