<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS - DOM Smooth Card Toggle</title>
  <style>
  .student-card {
    width: 240px; /* adjusted from 14px */
    background-color: white;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
  }

  .student-card img {
    width: 120px;
    height: 120px; 
    object-fit: cover;
    border-radius: 50%;
    margin-bottom: 15px;
  }

  .student-card h2 {
    margin-bottom: 10px;
  }

  .student-card p {
    margin: 6px 0;
  }

</style>
</head>
<body>
  <div class="student-card">
    <img src="../../CSS/CSS-Day-9/asserts/picture/kendricklamar.jpg" alt="Kendrick Lamar">
    <h2>Kendrick Lamar</h2>
    <p>Java Full Stack</p>
    <p>+1 555-123-4567</p>
  </div>
</body>
</body>
</html>
