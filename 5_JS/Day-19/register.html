<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Page</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .register-box {
            width: 350px;
            padding: 30px;

            background: white;
            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #111;
            color: white;

            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #333;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login{
         text-decoration: none;
         display: flex;
         margin-top: 20px;
         justify-content: center;
         color: black;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>Register</h1>

        <form id="registerForm">

            <div class="input-group">
                <label>Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <button type="submit">Register</button>
               <a class="login" href="login.html">Login</a>

        </form>

        <p id="message"></p>

    </div>
<script src="assets/js/register.js"></script>
</body>
</html>
