  JS - Identify Data Types
  <script>
    var userProgram = "React";
    var userNumber = 100;
    var userNumber1 = 99.5;
    var userBoolean = true;
    var userData;
    var userType= null;

    console.log(typeof userProgram);
    console.log(typeof userNumber);
    console.log(typeof userNumber1);
    console.log(typeof userBoolean);
    console.log(typeof userData);
    console.log(typeof userType);
  </script>
