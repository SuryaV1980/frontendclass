<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BS - Four Columns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <div class="container" style="height: 100vh;">
      <div class="row p-4 w-50 h-100  mt-3 d-flex align-items-center" >
        <div class="col-3 bg-info h-25 d-flex align-items-center  justify-content-center"> Box-1</div>
        <div class="col-3 bg-danger h-25 d-flex align-items-center  justify-content-center"> Box-2</div>
        <div class="col-3 bg-success h-25 d-flex align-items-center  justify-content-center"> Box-3</div>
        <div class="col-3 bg-secondary h-25 d-flex align-items-center justify-content-center"> Box-4</div>
      </div>
</body>
</html>
