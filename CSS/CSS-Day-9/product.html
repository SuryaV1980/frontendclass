<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>
    <link rel="stylesheet" href="asserts/CSS/product.css">
</head>
<body>

    <h1>Product Cards</h1>

    <div class="products">

        <div class="card">
            <img src="asserts/picture/bose.webp" alt="Headphones">
            <h2>Headphones</h2>
            <p class="price">$49</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="asserts/picture/smartwatch.jpg" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p class="price">$79</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="asserts/picture/keyboard.jpg" alt="Keyboard">
            <h2>Keyboard</h2>
            <p class="price">$39</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="asserts/picture/wireless mouse.webp" alt="Mouse">
            <h2>Wireless Mouse</h2>
            <p class="price">$29</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
