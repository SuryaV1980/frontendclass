<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Departments</title>

    <style>
        body{
            background-color:#e8eef7;
            text-align:center;
            font-family:Arial, sans-serif;
        }

        h1{
            background-color:#0d1b2a;
            color:white;
            width:80%;
            height:70px;
            margin:20px auto;
            line-height:70px;
        }

        .department{
            width:250px;
            height:120px;
            display:inline-block;
            margin:20px;
            color:white;
            text-align:center;
            line-height:120px;
            font-size:25px;
            font-weight:bold;
        }

        .cse{
            background-color:#2563eb;
        }

        .it{
            background-color:#16a34a;
        }

        .ece{
            background-color:#f97316;
        }

        .eee{
            background-color:#9333ea;
        }

        .mech{
            background-color:#dc2626;
        }
    </style>

</head>
<body>
<section>
<div>
<h1>Engineering Departments</h1>

<div class="department cse">CSE</div>

<div class="department it">IT</div>

<div class="department ece">ECE</div>

<div class="department eee">EEE</div>

<div class="department mech">Mechanical</div>
</div>

</section>
</body>
</html>
