<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
  
  <form method="get" >
    <table  cellpadding="10" align="center" class="form">
      <tr >
        <td colspan="2" align="center">
          <h1>
            Register Form
          </h1>
        </td>
      </tr>


      <tr>
        <td><label for="userName">Full Name:</label></td>
        <td><input type="text" placeholder="Enter your full name" id="userName" required></td>
      </tr>

      <tr>
        <td><label for="userEmail">Email:</label></td>
        <td><input type="text" placeholder="Enter your email" id="userEmail" required></td>
      </tr>

      <tr>
        <td><label for="userPassword">Password:</label></td>
        <td><input type="text" placeholder="Enter your Password" id="userPassword" required></td>
      </tr>

      <tr>
        <td><label for="userconfirmPassword">Confirm Password:</label></td>
        <td><input type="text" placeholder="Confirm your Password" id="userconfirmPassword" ></td>
      </tr>

      <tr>
        <td></td>
        <td><input type="button" value="Register" ></td>
      </tr>
    </table>
  </form>
 
</body>
</html>
