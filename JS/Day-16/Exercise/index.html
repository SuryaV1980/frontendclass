<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS - DOM Form</title>
</head>
<body>
  
  <table cellpadding="10">
    <tr>
      <td>
        Username: 
      </td>
      <td>
        <input type="text" id="userName" placeholder="Enter your name"/>
      </td>
    </tr>

    <tr>
      <td>
        Password: 
      </td>
      <td>
        <input type="text" id="userPassword" placeholder="Enter your Password"/>
      </td>
    </tr>

    <tr>
      <td>
        confirm Password: 
      </td>
      <td>
        <input type="text" id="userrePassword" placeholder="Enter your Password"/>
      </td>
    </tr>

    <tr>
      <td>
        <input type="button" id="submit" value="Register" />
      </td>
    </tr>
    
  </table>


  <script src="assets/JS/index.js"></script>
</body>
</html>
