<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 — Employee Details</title>
  <style>
    table{
      border-color: aquamarine;
    }
  </style>
</head>
<body>
    <form>
      <table cellpadding="5" cellspacing="5">
        <tr >
          <td>
            <label for="employeeName">Name:</label>
            
          </td>
          <td>
            <input id="employeeName" type="text" placeholder="Enter your Name" /> <br>
          </td>
        </tr>

        <tr>
            <td>
            <label for="employeeDepartment">Department:</label>
            </td>

            <td>
              <div id="employeeDepartment">
                <input type="checkbox" name="Department" value="Java Developer"/>Java Developer<br>
                <input type="checkbox" name="Department" value="Python Developer"/>Python Developer<br>
                <input type="checkbox" name="Department" value="MERN Developer"/>MERN Developer<br>
                <input type="checkbox" name="Department" value=".NET Developer"/>.NET Developer<br>
                <input type="checkbox" name="Department" value="FullStack Developer"/>FullStack Developer<br>
              </div>
            </td>
      </tr>

        <tr>
          <td>
            <label for="userSalary">Salary:</label>
          </td>

          <td>
            <input type="Number" id="employeeSalary" placeholder="Enter Your Salary" /> <br>
          </td>
        </tr>

        <tr>
          <td>
             <input id="button" type="button" value="Add employee" />
          </td>
        </tr>

      </table>

      <div id="output"></div>

    </form>

  <script src="assets/js/task2.js"></script>
</body>
</html>
